<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>记忆星球 · 连接设置</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1e8;color:#263c31;font:16px/1.6 "Microsoft YaHei",sans-serif}main{max-width:600px;margin:6vh auto;background:#fff;padding:36px;border-radius:22px;box-shadow:0 12px 50px #19372814}h1{margin:0 0 8px}p,small{color:#607368}label{display:block;margin:22px 0 6px;font-weight:600}input[type=password]{width:100%;font:inherit;border:1px solid #bac8bb;border-radius:9px;padding:12px}button,a.button{display:inline-block;background:#335b45;color:white;border:0;border-radius:9px;padding:12px 17px;font:inherit;cursor:pointer;text-decoration:none;margin:18px 8px 0 0}button.secondary{background:#edf1e8;color:#335b45}#message{white-space:pre-wrap;min-height:1.6em}small{display:block}.check{font-size:14px;font-weight:400}button:disabled{opacity:.5}a{color:#335b45}@media(max-width:620px){main{margin:16px;padding:24px}}
</style><main><h1>连接你的记忆星球</h1><p>填写你自己的星流 API KEY。WPS 授权可以稍后补充。</p><form id="setup"><label for="api">星流 API KEY</label><input id="api" type="password" autocomplete="off" spellcheck="false" maxlength="4096"><small id="apiHint">首次使用必填，模型调用使用你账号的额度。</small><label for="wps">wps_sid（可选）</label><input id="wps" type="password" autocomplete="off" spellcheck="false" maxlength="8192"><small id="wpsHint">从自己的 WPS 登录会话获取；只填 wps_sid 的值，不要填整个 Cookie。过期后在此更新。</small><label class="check"><input id="clear" type="checkbox"> 清除已保存的 WPS 授权</label><button id="save" type="submit">保存并进入</button><button id="check" class="secondary" type="button">检查已保存的星流连接</button><a id="back" class="button" hidden href="/demo/index.html">返回产品</a><p id="message" role="status" aria-live="polite"></p></form><small>凭据由 Windows 当前用户加密保存在本机，不随学习备份导出。更换电脑或 Windows 账号后重新填写；移动同机目录无需重新填写。检查连接不会生成题目。</small></main><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token')||sessionStorage.getItem('memory-planet-token')||'';
if(token)sessionStorage.setItem('memory-planet-token',token);history.replaceState(null,'',location.pathname);
const el=id=>document.getElementById(id);async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(r.status===401?'访问链接已更新，请重新双击“打开记忆星球.cmd”。':typeof d.detail==='string'?d.detail:'配置未通过校验，请检查输入。');return d}
async function init(){try{const s=await api('/setup/status');if(s.configured){el('apiHint').textContent='已保存；留空则保持不变。';el('back').hidden=false}if(s.wps_configured)el('wpsHint').textContent='已保存；留空则保持不变。授权过期后在此更新。'}catch(e){el('message').textContent=e.message}}
el('setup').onsubmit=async e=>{e.preventDefault();el('save').disabled=true;el('message').textContent='正在保存…';try{await api('/setup/save',{api_key:el('api').value,wps_sid:el('wps').value,clear_wps:el('clear').checked});el('api').value='';el('wps').value='';location.href='/demo/index.html'}catch(e){el('message').textContent=e.message;el('save').disabled=false}};
el('check').onclick=async()=>{el('check').disabled=true;el('message').textContent='正在检查已保存的配置…';try{el('message').textContent=(await api('/setup/check',{})).message}catch(e){el('message').textContent=e.message}finally{el('check').disabled=false}};init();
</script></html>
